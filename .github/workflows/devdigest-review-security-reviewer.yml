# DevDigest review agent "security-reviewer" - generated by DevDigest (workflow version 1).
# You may edit this file; re-exporting from DevDigest offers to regenerate it.
#
# Security notes:
#  - Runs on pull_request only (never pull_request_target) with least-privilege permissions.
#  - Checks out the PR BASE commit and never executes code from the PR head.
#  - Fork and Dependabot pull requests have no access to secrets: the runner skips the
#    review there and prints a notice in the job summary (the check passes, PR unreviewed).
#  - The install PR itself is skipped the same way: its base commit has no runner yet.
#  - Replace the runner step with the commented action once it is published:
#      # uses: devdigest/review-action@v1
name: DevDigest review (security-reviewer)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: devdigest-review-security-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEVDIGEST_MAX_DIFF_BYTES: "204800"
  DEVDIGEST_MAX_DIFF_LINES: "3000"

jobs:
  review:
    name: devdigest-review-security-reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run DevDigest review agent
        run: |
          if [ ! -f ".devdigest/agents/security-reviewer/runner/index.js" ]; then
            msg="DevDigest agent security-reviewer is not on the base branch yet (this is its install PR); review skipped."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node .devdigest/agents/security-reviewer/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_AGENT_SLUG: security-reviewer
          DEVDIGEST_POST_AS: github_review

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devdigest-result-security-reviewer
          path: devdigest-result.json
          if-no-files-found: ignore
          retention-days: 30
